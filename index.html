<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="0; url=https://amber-brick-glow-nova.grok.me/">
  <link rel="canonical" href="https://amber-brick-glow-nova.grok.me/">
  <title>Arcade moved</title>
  <style>
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #0b1014; color: #f2efe6; font-family: system-ui, sans-serif; }
    a { color: inherit; }
  </style>
</head>
<body>
  <p>Arcade moved to <a href="https://amber-brick-glow-nova.grok.me/">amber-brick-glow-nova.grok.me</a>.</p>
  <script>
if (navigator.serviceWorker) {
  navigator.serviceWorker.getRegistrations().then(function (regs) {
    return Promise.all(regs.map(function (reg) { return reg.unregister(); }));
  }).then(function () {
    if (window.caches) return caches.keys().then(function (keys) {
      return Promise.all(keys.map(function (name) { return caches.delete(name); }));
    });
  }).finally(function () {
    location.replace("https://amber-brick-glow-nova.grok.me/");
  });
} else {
  location.replace("https://amber-brick-glow-nova.grok.me/");
}
</script>
</body>
</html>
