<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="0; url=https://amber-brick-glow-nova.grok.me/">
  <link rel="canonical" href="https://amber-brick-glow-nova.grok.me/">
  <title>Skyline Signal</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #030c14; color: #d9f8ff; font: 16px/1.4 -apple-system, sans-serif; }
    a { color: #00e5ff; }
  </style>
</head>
<body>
  <p>Skyline Signal moved to <a href="https://amber-brick-glow-nova.grok.me/">amber-brick-glow-nova.grok.me</a>.</p>
  <script>
    (async () => {
      try {
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map((reg) => reg.unregister()));
          const keys = await caches.keys();
          await Promise.all(keys.map((key) => caches.delete(key)));
        }
      } finally {
        location.replace('https://amber-brick-glow-nova.grok.me/');
      }
    })();
  </script>
</body>
</html>
